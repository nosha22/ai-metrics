name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aimetrics
          POSTGRES_PASSWORD: aimetrics
          POSTGRES_DB: aimetrics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aimetrics" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://aimetrics:aimetrics@localhost:5432/aimetrics
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
      - name: Dashboards gerados estão atualizados
        run: python scripts/build_dashboards.py && git diff --exit-code grafana/dashboards
