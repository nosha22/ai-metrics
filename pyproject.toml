[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aimetrics"
version = "0.1.0"
description = "Métricas de adoção e impacto de IA da Outsmart"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aimetrics = "aimetrics.cli:main"

[tool.setuptools]
packages = ["aimetrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
