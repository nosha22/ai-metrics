apiVersion: 1
datasources:
  - name: AI metrics
    uid: aimetrics-pg
    type: grafana-postgresql-datasource
    url: db:5432
    user: grafana
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: aimetrics
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false
