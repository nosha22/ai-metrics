# Copy to .github/workflows/git-ai.yaml in EVERY measured repository
# (or run `git ai ci github install` at the repo root, which generates the same file).
#
# Why: GitHub's "Squash and merge" and "Rebase and merge" do not run Git AI,
# so the refs/notes/ai notes do not reach the final commit. This action rewrites them.
# Source: https://usegitai.com/docs/team-usage/ci-workflows
name: Git AI

on:
  pull_request:
    types: [closed]

jobs:
  git-ai:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install git-ai
        run: |
          curl -fsSL https://usegitai.com/install.sh | bash
          echo "$HOME/.git-ai/bin" >> $GITHUB_PATH
      - name: Run git-ai
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git ai ci github run
