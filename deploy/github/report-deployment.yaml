# Example: add at the end of each repo's production deployment workflow
# to feed the change failure rate. Alternative: use the GitHub Deployments API
# (the collector imports it on its own in `aimetrics sync deployments`).
#
# Secrets required in the repo: AI_METRICS_URL, AI_METRICS_EVENTS_TOKEN
      - name: Report deployment to AI metrics
        if: success()
        run: |
          curl -fsS -X POST "$AI_METRICS_URL/events/deployment" \
            -H "Authorization: Bearer $AI_METRICS_EVENTS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"id\": \"${GITHUB_REPOSITORY}-${GITHUB_RUN_ID}\", \"repo\": \"${GITHUB_REPOSITORY}\",
                 \"sha\": \"${GITHUB_SHA}\", \"previous_sha\": \"${{ github.event.before }}\"}"
        env:
          AI_METRICS_URL: ${{ secrets.AI_METRICS_URL }}
          AI_METRICS_EVENTS_TOKEN: ${{ secrets.AI_METRICS_EVENTS_TOKEN }}
